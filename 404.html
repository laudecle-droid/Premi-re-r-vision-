<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maintenance · L’école des élèves</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f4ee;--ink:#1d2433;--acc:#1b3a8a;--sub:#5b6577}
@media(prefers-color-scheme:dark){:root{--bg:#141a26;--ink:#eef1f7;--acc:#8fb0ff;--sub:#a7b0c2}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{display:grid;place-items:center;min-height:100vh;padding:24px 16px;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:460px}
.lg{width:84px;height:84px;margin:0 auto 14px;display:block}
h1{font-size:clamp(24px,6vw,32px);margin:0 0 10px;line-height:1.2}
p{margin:0 0 12px;color:var(--sub)}
.bar{height:6px;border-radius:99px;background:rgba(127,127,127,.25);overflow:hidden;margin:18px auto 12px;max-width:260px}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--acc);animation:mv 1.6s ease-in-out infinite}
@keyframes mv{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
button{font:600 16px system-ui,sans-serif;padding:10px 18px;border-radius:12px;border:2px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer}
</style></head><body>
<main role="status" aria-live="polite">
<svg class="lg" viewBox="-50 -50 100 100" aria-hidden="true"><clipPath id="c"><circle r="44"/></clipPath><circle r="46" fill="#62bdf8" stroke="currentColor" stroke-width="3"/><g clip-path="url(#c)" stroke="#fff" stroke-width="7" fill="none"><path d="M-28,47 L-4,-48"/><path d="M28,47 L4,-48"/></g></svg>
<h1>Site en maintenance</h1>
<p>Une mise à jour est en cours. Le site rouvre dans quelques minutes : tes points et ta progression sont conservés.</p>
<div class="bar" aria-hidden="true"><i></i></div>
<p id="m">Cette page se recharge toute seule.</p>
<button id="b" type="button">Réessayer maintenant</button>
</main>
<script>
(function(){
  function go(){fetch(location.href,{cache:"no-store"}).then(function(r){if(r.ok)location.reload();else document.getElementById("m").textContent="Toujours en maintenance… nouvelle vérification dans quelques secondes."}).catch(function(){document.getElementById("m").textContent="Connexion indisponible. Nouvelle vérification dans quelques secondes."})}
  document.getElementById("b").onclick=go;setInterval(go,20000);
})();
</script>
</body></html>
